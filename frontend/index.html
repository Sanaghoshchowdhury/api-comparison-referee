<html>
<head>
    <title>API Comparison Tool</title>
</head>
<body>

<h2>API Comparison Tool (Referee)</h2>

<button onclick="compare()">Compare APIs</button>

<pre id="output"></pre>

<script>
function compare() {
    fetch("http://127.0.0.1:8000/compare")
        .then(response => response.json())
        .then(data => {
            document.getElementById("output").innerText =
                JSON.stringify(data, null, 2);
        });
}
</script>

</body>
</html>
